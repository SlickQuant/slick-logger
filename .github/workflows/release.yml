name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write

jobs:
  # The library itself is header-only, but the multi-process collector is a real
  # executable, so it has to be built per platform and attached to the release.
  build-collector:
    name: Build collector (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SLICK_LOGGER_COLLECTOR=ON
          -DBUILD_SLICK_LOGGER_TESTING=OFF
          -DBUILD_SLICK_LOGGER_EXAMPLES=OFF

      - name: Build collector
        run: cmake --build build --config Release --target slick_log_collector

      # Installing normalizes the output path: single-config generators put the
      # binary in build/tools, multi-config ones in build/tools/Release.
      - name: Stage binary
        run: cmake --install build --config Release --prefix stage

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x stage/bin/slick_log_collector
          tar -czf "slick-log-collector-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}.tar.gz" \
            -C stage/bin slick_log_collector

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path stage/bin/slick_log_collector.exe `
            -DestinationPath "slick-log-collector-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}.zip"

      - name: Upload collector artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-${{ matrix.platform }}
          path: |
            slick-log-collector-*.tar.gz
            slick-log-collector-*.zip
          if-no-files-found: error

  create-release:
    needs: build-collector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG ]; then
            # Extract the section for this version from CHANGELOG
            VERSION="${{ github.ref_name }}"
            # Escape dots in version for regex
            VERSION_ESCAPED=$(echo "$VERSION" | sed 's/\./\\./g')
            # Use awk to extract content: start at version header, stop at next ## header
            CHANGES=$(awk "BEGIN{p=0} /^# $VERSION_ESCAPED/{p=1;next} /^# /{p=0} p" CHANGELOG | sed '/^$/d')

            if [ -z "$CHANGES" ]; then
              echo "CHANGELOG_CONTENT=No changelog entry found for this version." >> $GITHUB_OUTPUT
            else
              # Escape newlines for GitHub output
              echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG_CONTENT=CHANGELOG not found." >> $GITHUB_OUTPUT
          fi

      # logger.hpp includes <slick/queue.h>, which pulls in <slick/shm/...> from
      # slick-shm, a further dependency of slick-queue. Rather than hand-resolving
      # that graph here, let CMake fetch it: whatever the build actually compiles
      # against is what gets bundled, and a new transitive header would be picked
      # up by the self-containment check below instead of silently going missing.
      - name: Fetch the dependency headers the build resolves
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SLICK_LOGGER_COLLECTOR=OFF
          -DBUILD_SLICK_LOGGER_TESTING=OFF
          -DBUILD_SLICK_LOGGER_EXAMPLES=OFF

      - name: Bundle the dependency headers
        run: |
          set -e
          # Copy every slick/* header the fetched dependencies provide, so this
          # keeps working if the dependency graph grows another header or repo.
          found=0
          for dep_include in $(find build/_deps -type d -path '*-src/include' | sort); do
            if [ -d "$dep_include/slick" ]; then
              echo "bundling from $dep_include"
              cp -r "$dep_include/slick/." include/slick/
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "no dependency headers found under build/_deps" >&2
            find build/_deps -maxdepth 2 -type d >&2
            exit 1
          fi
          # Bundling source means shipping its licence too.
          mkdir -p licenses
          for dep_src in $(find build/_deps -maxdepth 1 -type d -name '*-src' | sort); do
            name=$(basename "$dep_src" -src)
            for lic in "$dep_src"/LICENSE*; do
              [ -f "$lic" ] && cp "$lic" "licenses/LICENSE-$name" && break
            done
            [ -f "licenses/LICENSE-$name" ] || echo "WARNING: no LICENSE found for $name" >&2
          done
          echo "bundled header tree:"
          find include -type f | sort
          ls -1 licenses/

      # The real guarantee: compile logger.hpp against the archive contents alone.
      # If any header the dependency graph needs is missing, this fails here rather
      # than in a user's build after the release is published.
      - name: Verify the archive is self-contained
        run: |
          set -e
          printf '#include <slick/logger.hpp>\nint main() { return 0; }\n' > selfcheck.cpp
          g++ -std=c++20 -Iinclude -c selfcheck.cpp -o selfcheck.o
          echo "logger.hpp compiles against the bundled headers alone"
          rm -f selfcheck.cpp selfcheck.o

      - name: Create header archive
        run: |
          zip -r ./slick-logger-${{ steps.get_version.outputs.VERSION }}.zip include/ licenses/
          tar -czf ./slick-logger-${{ steps.get_version.outputs.VERSION }}.tar.gz include/ licenses/

      - name: Download collector binaries
        uses: actions/download-artifact@v4
        with:
          pattern: collector-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Downloads

            The library is header-only: take `slick-logger-${{ steps.get_version.outputs.VERSION }}.zip`
            or `.tar.gz` and add `include/` to your include path. The archive is
            self-contained - alongside `slick/logger.hpp` it bundles the
            `slick/queue.h` and `slick/shm/` headers it includes, from
            [slick-queue](https://github.com/SlickQuant/slick-queue) and
            [slick-shm](https://github.com/SlickQuant/slick-shm), so there is no
            separate dependency to install. Their licences are in `licenses/`.

            `slick-log-collector-*` contains the prebuilt standalone collector for
            [multi-process logging](https://github.com/SlickQuant/slick-logger#multi-process-logging-shared-memory).
            It is optional; you only need it to collect log entries from several
            processes into one set of sinks.

          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            slick-logger-${{ steps.get_version.outputs.VERSION }}.zip
            slick-logger-${{ steps.get_version.outputs.VERSION }}.tar.gz
            slick-log-collector-*.tar.gz
            slick-log-collector-*.zip
