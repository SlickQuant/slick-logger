name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write

jobs:
  # The library itself is header-only, but the multi-process collector is a real
  # executable, so it has to be built per platform and attached to the release.
  build-collector:
    name: Build collector (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SLICK_LOGGER_COLLECTOR=ON
          -DBUILD_SLICK_LOGGER_TESTING=OFF
          -DBUILD_SLICK_LOGGER_EXAMPLES=OFF

      - name: Build collector
        run: cmake --build build --config Release --target slick_log_collector

      # Installing normalizes the output path: single-config generators put the
      # binary in build/tools, multi-config ones in build/tools/Release.
      - name: Stage binary
        run: cmake --install build --config Release --prefix stage

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x stage/bin/slick_log_collector
          tar -czf "slick-log-collector-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}.tar.gz" \
            -C stage/bin slick_log_collector

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path stage/bin/slick_log_collector.exe `
            -DestinationPath "slick-log-collector-${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}.zip"

      - name: Upload collector artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-${{ matrix.platform }}
          path: |
            slick-log-collector-*.tar.gz
            slick-log-collector-*.zip
          if-no-files-found: error

  create-release:
    needs: build-collector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG ]; then
            # Extract the section for this version from CHANGELOG
            VERSION="${{ github.ref_name }}"
            # Escape dots in version for regex
            VERSION_ESCAPED=$(echo "$VERSION" | sed 's/\./\\./g')
            # Use awk to extract content: start at version header, stop at next ## header
            CHANGES=$(awk "BEGIN{p=0} /^# $VERSION_ESCAPED/{p=1;next} /^# /{p=0} p" CHANGELOG | sed '/^$/d')

            if [ -z "$CHANGES" ]; then
              echo "CHANGELOG_CONTENT=No changelog entry found for this version." >> $GITHUB_OUTPUT
            else
              # Escape newlines for GitHub output
              echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG_CONTENT=CHANGELOG not found." >> $GITHUB_OUTPUT
          fi

      # logger.hpp includes <slick/queue.h>, which in turn pulls in <slick/shm/...>,
      # so an archive holding only our own header is not usable on its own. Both
      # the repository and the tag are read out of CMakeLists.txt rather than
      # repeated here, so the bundled headers can never drift from the version the
      # build actually requires.
      - name: Resolve the slick-queue version the build requires
        id: queue
        run: |
          REPO=$(grep -oP 'GIT_REPOSITORY\s+\K\S+' CMakeLists.txt)
          TAG=$(grep -oP 'GIT_TAG\s+\K\S+' CMakeLists.txt)
          if [ -z "$REPO" ] || [ -z "$TAG" ]; then
            echo "could not resolve slick-queue GIT_REPOSITORY/GIT_TAG from CMakeLists.txt" >&2
            exit 1
          fi
          REPO=${REPO#https://github.com/}
          REPO=${REPO%.git}
          echo "REPO=$REPO" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "bundling $REPO@$TAG"

      - name: Check out slick-queue
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.queue.outputs.REPO }}
          ref: ${{ steps.queue.outputs.TAG }}
          path: .slick-queue

      - name: Bundle the slick-queue headers
        run: |
          set -e
          SRC=.slick-queue/include/slick
          if [ ! -f "$SRC/queue.h" ] || [ ! -d "$SRC/shm" ]; then
            echo "unexpected slick-queue layout; queue.h or shm/ not where expected:" >&2
            find .slick-queue -name 'queue.h' -o -name 'shm' -type d >&2
            exit 1
          fi
          cp "$SRC/queue.h" include/slick/
          cp -r "$SRC/shm" include/slick/
          cp .slick-queue/LICENSE ./LICENSE-slick-queue
          # Fail here rather than publishing an archive that cannot compile.
          test -f include/slick/queue.h
          test -f include/slick/shm/shared_memory.hpp
          test -f include/slick/shm/detail/platform.hpp
          echo "bundled header tree:"
          find include -type f | sort

      - name: Create header archive
        run: |
          zip -r ./slick-logger-${{ steps.get_version.outputs.VERSION }}.zip include/ LICENSE-slick-queue
          tar -czf ./slick-logger-${{ steps.get_version.outputs.VERSION }}.tar.gz include/ LICENSE-slick-queue

      - name: Download collector binaries
        uses: actions/download-artifact@v4
        with:
          pattern: collector-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Downloads

            The library is header-only: take `slick-logger-${{ steps.get_version.outputs.VERSION }}.zip`
            or `.tar.gz` and add `include/` to your include path. The archive is
            self-contained - alongside `slick/logger.hpp` it bundles the
            `slick/queue.h` and `slick/shm/` headers from
            [slick-queue](https://github.com/SlickQuant/slick-queue) that it includes,
            so there is no separate dependency to install. `LICENSE-slick-queue`
            covers those bundled files.

            `slick-log-collector-*` contains the prebuilt standalone collector for
            [multi-process logging](https://github.com/SlickQuant/slick-logger#multi-process-logging-shared-memory).
            It is optional; you only need it to collect log entries from several
            processes into one set of sinks.

          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            slick-logger-${{ steps.get_version.outputs.VERSION }}.zip
            slick-logger-${{ steps.get_version.outputs.VERSION }}.tar.gz
            slick-log-collector-*.tar.gz
            slick-log-collector-*.zip
