name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_SLICK_LOGGER_COLLECTOR=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Upload artifacts (Release only)
      if: matrix.build_type == 'Release' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: slick-logger-package
        path: build/dist/*.zip

  # Debug builds on GCC/Clang already compile with -fsanitize=address,undefined
  # (see CMakeLists.txt). This job runs them with options that make a finding fail
  # the build: UBSan only prints and continues by default, so without
  # halt_on_error a real error would pass CI unnoticed.
  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SLICK_LOGGER_COLLECTOR=ON

    - name: Build
      run: cmake --build build --config Debug

    - name: Run tests under ASan/UBSan
      working-directory: build
      env:
        # LeakSanitizer is on by default with ASan on Linux and unsupported on
        # macOS, so detect_leaks is deliberately left at its platform default.
        ASAN_OPTIONS: abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest -C Debug --output-on-failure
